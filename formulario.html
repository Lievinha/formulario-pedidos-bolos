<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pedidos de Bolos</h1>
    <form method="post" action="teste.jsp">
        Nome: <input type="text" name="nome"> <br>
        Email: <input type="email" name="email"> <br>
        Tamanho: 
        <input type="radio" name="tamanho"  value="g" checked> Grande 
        <input type="radio" name="tamanho"  value="m"> Medio
        <input type="radio" name="tamanho"  value="p"> Pequeno
        <br>
        Recheio: <select name="recheio">
            <option>Chocolate</option>
            <option>Coco</option>
            <option>Ninho</option>
        </select>
        <br>
        Adicionais:
         <input type ="checkbox" name="morangos" value="sim"> Morangos
         <input type ="checkbox" name="abacaxi" value="sim"> Abacaxi
         <br>
         Data Entrega:<input type="date" name=" dataEntrega">
        <br>
        Descreva a Decoração:
        <br>
         <textarea name="mensagem" rows="10" cols="30"></textarea>
        <br>
        <input type="submit" value="Pronto para Enviar">

    </form>
</body>
</html>
